name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck, lint, test, build, manifest check)
        run: pnpm verify

      # --with-deps also installs system libraries through apt, which fails when
      # Ubuntu's package mirrors are unreachable. Retry, then fall back to the
      # browser alone: the runner image already ships Chrome's libraries.
      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            # When mirrors are unreachable, apt waits on DNS for minutes; cap each attempt.
            if timeout 150 pnpm exec playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Attempt $attempt to install Chromium with system packages failed."
            sleep 20
          done
          echo "::warning::Installing Chromium without system packages."
          pnpm exec playwright install chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Zip extension
        run: pnpm zip

      - name: Upload extension zip
        uses: actions/upload-artifact@v7
        with:
          name: spam-sentinel-chrome
          path: .output/*-chrome.zip
          if-no-files-found: error
          # .output/ starts with a dot, which upload-artifact treats as hidden.
          include-hidden-files: true
